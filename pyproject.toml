[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiebepy"
version = "1.0.0"
description = "Funções Wiebe de 1 a 5 estágios: avaliação, derivada analítica, ajuste (PSO), comparação de modelos e execução serial/paralela/GPU"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "L. Queiroz / I. L. Ferreira" }]
keywords = ["wiebe", "combustion", "mass fraction burned", "pso", "gpu"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
numba = ["numba>=0.59"]            # kernels compilados (CPU)
gpu = ["cupy-cuda12x>=13.0"]       # GPU NVIDIA (opcional)
gui = ["streamlit>=1.52", "altair>=5.0,<6", "pandas>=2.0"]   # interface
                                   # gráfica; altair 6.x emite spec
                                   # vega-lite 6 que o vega-embed do
                                   # streamlit 1.64 não renderiza
                                   # (gráficos em branco)
cfd = ["pyyaml>=6.0"]              # módulo CFD opcional. NÃO instala o
                                   # solver externo (OpenFOAM vem do WSL2/
                                   # Linux — ver docs/cfd/install.md)
dev = ["pytest>=7.0"]

[project.scripts]
wiebepy = "wiebepy.cli.parser:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wiebepy.gui" = ["app_pages/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: testes longos (ajustes completos, multiprocessing)",
    "gpu: requer CuPy e GPU NVIDIA",
]
