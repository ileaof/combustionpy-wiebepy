# =====================================================================
# Caso controlado case_012 — DIAGNÓSTICO DE RC EFETIVO (hipótese da
# investigação: o resíduo p×θ do case_006 é dominado pela compressão,
# cujo n_eff do ensaio (1,284 em −40..−20°) é incompatível com zona
# única de γ constante e Rc nominal 17; a calibração com Rc livre
# reduz o RMSE 0-D de 116 para 44,6 kPa).
#
# Igual ao case_006 (γ=1,37 equivalente, fonte calibrada, paredes 440 K,
# kEpsilon), exceto:
#   * engine.Rc = 15.63540583 (EFETIVO, da calibração com Rc livre) —
#     CONTRADIZ a geometria documentada (Rc 17); NÃO usar como projeto.
#   * fonte Wiebe = model_cfd_duo_rc15635.json (2 estágios, calibrada
#     em par com este Rc).
#
# ATENÇÃO: caso DIAGNÓSTICO. A comparação com o ensaio não é validação;
# serve para confirmar (ou refutar) a causa do resíduo de compressão.
# =====================================================================
engine:
  bore_mm: 86.0
  stroke_mm: 70.0
  rod_length_mm: 117.5
  Rc: 15.63540583        # EFETIVO (diagnóstico); nominal documentado: 17.0
  rpm: 3396.20
  m_fuel_kg_per_cycle: 9.42754647351e-6
  LHV_kJ_per_kg: 39191.3
  T1_K: 308.15
  Tw_K: 440.0

cfd:
  enabled: true
  adapter: openfoam
  mode: prescribed_wiebe
  case_directory: results/cfd/case_017_malha_fina
  workers: 1
  wsl_distro: Ubuntu-22.04

  geometry:
    type: simplified_cylinder
    moving_piston: true
    n_radial: 36
    n_axial: 54

  interval:
    angle_unit: deg
    start: -120
    end: 120

  initial:
    P_kPa: 127.6
    T_K: 308.15

  walls:
    Tw_K: 440
    model: fixed_temperature

  turbulence:
    model: kEpsilon
    wall_functions: true

  numerics:
    deltaT_s: 1.0e-6
    max_Co: 0.25    # 0,5 abortou neste caso (T negativa em -23,6° CA); ver §5b
    write_interval_deg: 10

  heat_source:
    distribution: uniform
    region: null

  fuel:
    name: diesel
    feed: premixed_gas

  gas:
    Cp_J_kgK: 1063.0        # γ = 1063/(1063−287,07) = 1,370 — equivalência
    molWeight_kg_kmol: 28.96
    mu_Pa_s: 5.5e-05
    Pr: 0.7

  wiebe:
    source: model
    model: examples/model_cfd_duo_rc15635.json

  comparison:
    criterion: same_rpm_same_energy
    experimental: examples/data/ensaio_P_exp_carga3_45.txt
    experimental_angle_unit: rad
    experimental_pressure_unit: bar
    experimental_offset_deg: 0.0