# =====================================================================
# Caso controlado case_013 — VERIFICAÇÃO DA CONSERVAÇÃO DA FONTE
# `distribution: region` COM MALHA MÓVEL (antes de recomendá-la).
#
# Igual ao case_006 (γ=1,37 equivalência, fonte calibrada 1 estágio,
# paredes 440 K, kEpsilon), exceto a distribuição espacial: `region`
# (caixa axial com metade da altura da câmara no início da janela —
# hipótese declarada em case_builder).
#
# Objetivo: medir a energia efetivamente injetada pelo fvModel
# heatSource no modo Q (potência total) com pistão em movimento,
# via fechamento ΔU + W + perda vs energia prescrita (369,48 J).
# RESULTADO MEDIDO (verification.md §3e): entrega efetiva de apenas
# 10,7% (39,40 J de 369,48 J prescritos) — a limitação do OF13 (volume
# da zona congelado na construção, §4) confirma-se empiricamente.
# VEREDITO: NÃO usar `region` com malha móvel; preferir `uniform`.
# =====================================================================
engine:
  bore_mm: 86.0
  stroke_mm: 70.0
  rod_length_mm: 117.5
  Rc: 17.0
  rpm: 3396.20
  m_fuel_kg_per_cycle: 9.42754647351e-6
  LHV_kJ_per_kg: 39191.3
  T1_K: 308.15
  Tw_K: 440.0

cfd:
  enabled: true
  adapter: openfoam
  mode: prescribed_wiebe
  case_directory: results/cfd/case_013
  workers: 1
  wsl_distro: Ubuntu-22.04

  geometry:
    type: simplified_cylinder
    moving_piston: true
    n_radial: 24
    n_axial: 36

  interval:
    angle_unit: deg
    start: -120
    end: 120

  initial:
    P_kPa: 127.6
    T_K: 308.15

  walls:
    Tw_K: 440
    model: fixed_temperature

  turbulence:
    model: kEpsilon
    wall_functions: true

  numerics:
    deltaT_s: 1.0e-6
    max_Co: 0.25
    write_interval_deg: 10

  heat_source:
    distribution: region
    region: zonaInferior

  fuel:
    name: diesel
    feed: premixed_gas

  gas:
    Cp_J_kgK: 1063.0        # γ = 1,370 — equivalência com o 0-D
    molWeight_kg_kmol: 28.96
    mu_Pa_s: 5.5e-05
    Pr: 0.7

  wiebe:
    source: model
    model: examples/model_cfd_calibrated.json

  comparison:
    criterion: same_rpm_same_energy
    experimental: examples/data/ensaio_P_exp_carga3_45.txt
    experimental_angle_unit: rad
    experimental_pressure_unit: bar
    experimental_offset_deg: 0.0